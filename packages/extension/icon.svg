<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="#1a1040"/>
  
  <!-- Glow effect -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#4eeadb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1a1040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8f0ed"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="32" fill="url(#glow)"/>
  
  <!-- Ghost body -->
  <path d="M128 50C92 50 65 80 65 115v75c0 0 10-8 18 0s12 8 20 0 12-8 20 0 12 8 20 0 12-8 20 0 12 8 18 0V115c0-35-27-65-63-65z" 
