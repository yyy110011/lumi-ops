  <!-- Left eye -->
  <ellipse cx="105" cy="120" rx="12" ry="14" fill="#1a1040"/>
  <ellipse cx="108" cy="116" rx="4" ry="5" fill="#4eeadb"/>
  
  <!-- Right eye -->
  <ellipse cx="151" cy="120" rx="12" ry="14" fill="#1a1040"/>
  <ellipse cx="154" cy="116" rx="4" ry="5" fill="#4eeadb"/>
  
  <!-- Smile -->
  <path d="M112 145 Q128 160 144 145" stroke="#1a1040" stroke-width="3" fill="none" stroke-linecap="round"/>
