name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Publishing version: $VERSION"

      - name: Set version in package.json
        run: |
          cd packages/cli
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          cd ../extension
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          cd ../mcp-server
          npm version "$VERSION" --no-git-tag-version --allow-same-version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI (shared dependency)
        run: pnpm --filter @lumi-ops/cli build

      - name: Build MCP Server
        run: pnpm --filter @lumi-ops/mcp-server build

      # skipDuplicate on marketplace steps + registry check on npm keep every
      # publish step idempotent, so a partially failed run can be re-run safely.
      - name: Publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OVSX_PAT }}
          registryUrl: https://open-vsx.org
          packagePath: packages/extension
          dependencies: false
          skipDuplicate: true

      - name: Publish to VS Code Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.AZURE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          packagePath: packages/extension
          dependencies: false
          skipDuplicate: true

      - name: Publish MCP Server to npm
        run: |
          if npm view "@lumi-ops/mcp-server@${VERSION}" version >/dev/null 2>&1; then
            echo "⏭ @lumi-ops/mcp-server@${VERSION} already on npm — skipping"
          else
            npm publish --access public
          fi
        working-directory: packages/mcp-server
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create version bump PR
        run: |
          BRANCH="chore/bump-v${VERSION}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "⏭ Branch ${BRANCH} already exists — skipping bump PR"
            exit 0
          fi

          if git diff --quiet -- packages/cli/package.json packages/extension/package.json packages/mcp-server/package.json; then
            echo "⏭ Versions already at ${VERSION} on main — skipping bump PR"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add packages/cli/package.json packages/extension/package.json packages/mcp-server/package.json
          git commit -m "chore: bump version to ${VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: bump version to v${VERSION}" \
            --body "Auto-generated by CI after publishing v${VERSION} to Open VSX, VS Code Marketplace, and npm." \
            --base main \
            --head "$BRANCH"
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
