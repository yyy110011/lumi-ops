name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Publishing version: $VERSION"

      - name: Set version in package.json
        run: |
          cd packages/cli
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
          cd ../extension
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
          cd ../mcp-server
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI (shared dependency)
        run: pnpm --filter @lumi-ops/cli build

      - name: Build MCP Server
        run: pnpm --filter @lumi-ops/mcp-server build

      - name: Publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OVSX_PAT }}
          registryUrl: https://open-vsx.org
          packagePath: packages/extension
          dependencies: false

      - name: Publish to VS Code Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.AZURE_PAT }}
          registryUrl: https://marketplace.visualstudio.com
          packagePath: packages/extension
          dependencies: false

      - name: Publish MCP Server to npm
        run: npm publish --access public
        working-directory: packages/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create version bump PR
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          BRANCH="chore/bump-v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add packages/cli/package.json packages/extension/package.json packages/mcp-server/package.json
          git commit -m "chore: bump version to ${VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: bump version to v${VERSION}" \
            --body "Auto-generated by CI after publishing v${VERSION} to Open VSX, VS Code Marketplace, and npm." \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
